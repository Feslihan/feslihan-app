<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    background: #F5EDE3;
    font-family: "Inter", sans-serif;
    color: #2C1810;
    display: flex; flex-direction: column;
    padding: 90px 92px 64px;
    position: relative; overflow: hidden;
  }
  .eyebrow {
    font-size: 24px; font-weight: 600; letter-spacing: 5px;
    color: #C67B5C; text-transform: uppercase;
  }
  h1 {
    font-family: "Lora", Georgia, serif; font-weight: 700;
    font-size: 80px; line-height: 1.15; margin-top: 30px;
    letter-spacing: -1px;
  }
  .rule { height: 3px; width: 120px; background: #C67B5C; margin: 44px 0; }
  .body {
    font-size: 38px; line-height: 1.65; color: #4a3528;
    white-space: pre-line;
  }
  .anne-notu {
    margin-top: 56px; padding: 36px 44px;
    background: #FFF8F0; border-left: 6px solid #4A7C59; border-radius: 0 18px 18px 0;
    font-family: "Lora", serif; font-style: italic;
    font-size: 32px; line-height: 1.5; color: #2E4F38;
  }
  footer {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between;
    border-top: 2px solid #EDE0D0; padding-top: 34px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 40px; height: 40px; }
  .brand-name { font-family: "Lora", serif; font-weight: 600; font-size: 36px; color: #2E4F38; }
  .handle { font-size: 27px; color: #A89585; }
</style>
</head>
<body>
  <div class="eyebrow">Mutfak Defterinden · İpucu</div>
  <h1>{{tip_title}}</h1>
  <div class="rule"></div>
  <div class="body">{{tip_body}}</div>
  <div class="anne-notu">Anne notu: {{anne_notu}}</div>

  <footer>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="#4A7C59"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>
      <span class="brand-name">Feslihan</span>
    </div>
    <div class="handle">{{handle}}</div>
  </footer>
</body>
</html>
