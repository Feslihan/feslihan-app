<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    background: linear-gradient(170deg, #2E4F38 0%, #4A7C59 100%);
    font-family: "Inter", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px; position: relative; overflow: hidden;
  }
  .big-question {
    position: absolute; top: 90px; left: 0; right: 0; text-align: center;
    font-family: "Lora", serif; font-style: italic; font-size: 58px;
    color: rgba(255, 248, 240, 0.55); letter-spacing: 1px;
  }
  .series {
    position: absolute; top: 170px; left: 0; right: 0; text-align: center;
    font-size: 22px; letter-spacing: 6px; color: rgba(255,248,240,0.45);
    text-transform: uppercase; font-weight: 600;
  }
  .card {
    width: 100%; background: #FFF8F0; border-radius: 36px;
    padding: 56px 60px; box-shadow: 0 30px 80px rgba(0,0,0,0.25);
  }
  .card-head { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .app-dot {
    width: 72px; height: 72px; border-radius: 18px; background: #2E4F38;
    display: flex; align-items: center; justify-content: center;
  }
  .app-dot svg { width: 42px; height: 42px; }
  .notif-meta { flex: 1; }
  .notif-app { font-size: 26px; font-weight: 600; color: #2C1810; }
  .notif-time { font-size: 24px; color: #A89585; }
  .notif-title { font-family: "Lora", serif; font-weight: 700; font-size: 52px; color: #2C1810; margin-bottom: 18px; }
  .notif-body { font-size: 36px; line-height: 1.45; color: #6B5244; }
  .notif-body strong { color: #2E4F38; }
  .hook {
    margin-top: 70px; text-align: center;
    font-family: "Lora", serif; font-style: italic;
    font-size: 40px; line-height: 1.4; color: #FFF8F0; max-width: 820px;
  }
  footer {
    position: absolute; bottom: 64px; left: 0; right: 0; text-align: center;
    font-size: 27px; color: rgba(255,248,240,0.75);
  }
</style>
</head>
<body>
  <div class="big-question">"Bugün ne pişirsem?"</div>
  <div class="series">Yarın Ne Pişirsem · {{series_no}}</div>

  <div class="card">
    <div class="card-head">
      <div class="app-dot">
        <svg viewBox="0 0 24 24" fill="#FFF8F0"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>
      </div>
      <div class="notif-meta">
        <div class="notif-app">Feslihan</div>
        <div class="notif-time">her akşam 20:00</div>
      </div>
    </div>
    <div class="notif-title">Yarın ne pişirsem?</div>
    <div class="notif-body">Yarın için önerimiz: <strong>{{title}}</strong> — {{time}}, {{servings}} kişilik. Afiyet olsun!</div>
  </div>

  <div class="hook">{{hook}}</div>

  <footer>Bu soruyu her gün senin yerine cevaplıyoruz · {{handle}}</footer>
</body>
</html>
